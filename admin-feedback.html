<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback Dashboard | WishCraft Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <header class="create-header">
        <a href="index.html" class="back-btn">
            <i class="ri-arrow-left-line"></i>
            Back
        </a>
        <h1>Customer Feedback Dashboard</h1>
    </header>

    <!-- Password Gate -->
    <section class="create-section" id="loginGate">

        <form class="wish-form" id="adminLoginForm" style="max-width:400px;">

            <div class="form-group">
                <label>Enter Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Password" required>
            </div>

            <button type="submit" class="primary-btn">Unlock Dashboard</button>

            <p id="loginError" class="feedback-status error"></p>

        </form>

    </section>

    <!-- Feedback List (hidden until password correct) -->
    <section class="create-section" id="feedbackDashboard" style="display:none;">

        <div class="feedback-summary" id="feedbackSummary"></div>

        <div id="feedbackList" class="feedback-list"></div>

    </section>

    <script type="module" src="javascript/admin-feedback.js"></script>

</body>
</html>
